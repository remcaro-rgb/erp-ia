name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:rules
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm test:integration
      - run: supabase stop
        if: always()

  # The Docker target (design §21, rule 6): the whole stack from docker-compose.yml (self-hosted Supabase, web,
  # Workflow worker on the Postgres World), a real export job and outbox dispatch through it, then the integration
  # suites against its database, Auth and Storage.
  docker-integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh local-only secrets for this run (.env.docker is never committed).
      - run: pnpm docker:env
      - run: docker compose --env-file .env.docker up -d --build --wait --wait-timeout 600
      - name: Real workflows on the Postgres World (export job through the web app, outbox tick by the worker)
        run: |
          set -a; . ./.env.docker; set +a
          pnpm -F worker smoke
      - name: Integration suites against the compose stack
        run: |
          # The suites share one outbox and drain it themselves (one package at a time): the worker's tick would
          # drain it under them, so it stops first.
          docker compose --env-file .env.docker stop worker
          set -a; . ./.env.docker; set +a
          export DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:${DB_HOST_PORT}/postgres"
          export TEST_DATABASE_URL="$DATABASE_URL" WORKFLOW_POSTGRES_URL="$DATABASE_URL" WORKFLOW_TARGET_WORLD="@workflow/world-postgres"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:${KONG_HOST_PORT}" SUPABASE_URL="http://127.0.0.1:${KONG_HOST_PORT}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm test:integration
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color --tail 300
      - run: docker compose --env-file .env.docker down -v
        if: always()
