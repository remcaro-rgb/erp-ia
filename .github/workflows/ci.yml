name: CI

permissions:
  contents: read

on:
  # A PR runs once (pull_request); main runs again after the merge.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:rules
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: pnpm test:integration
      - run: supabase stop
        if: always()

  # End to end (rule 31, design §21, Task 22): every Playwright spec against `next dev` on the CLI stack with the demo
  # company (`supabase start` applies the migrations and supabase/seed.sql, then `DEMO_SEED=1 pnpm db:seed`, set
  # job-wide below, and the help index), the phase 1 smoke included. The assistant runs on the AI SDK mock model
  # (AGENT_MODEL=mock, playwright.config.ts) unless the repository provides AI_GATEWAY_API_KEY. The specs run against
  # the production build (`next build`, then `next start` through E2E_SERVER=start): on the 2-vCPU runner `next dev`
  # compiles each route on its first request (5 to 18 s) and the specs' waits expired on it (2026-10-29).
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    env:
      DEMO_SEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F web exec playwright install --with-deps chromium
      - run: supabase start
      - run: pnpm db:seed
      # The gateway key reaches only the two steps that use it (not `pnpm install` and its lifecycle scripts), with one
      # value for both: the help index and the app use the gateway, or the deterministic embedder and the mock model.
      - run: pnpm help:index
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - run: pnpm -F web build
      - run: pnpm -F web e2e
        env:
          E2E_SERVER: start
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: apps/web/test-results
          retention-days: 7
      - run: supabase stop
        if: always()

  # The Docker target (design §21, rule 6): the whole stack from docker-compose.yml (self-hosted Supabase, web behind
  # the nginx edge, Workflow worker on the Postgres World, init jobs), with docker-compose.test.yml publishing the
  # database and API for the host-side checks: the edge guards and real workflows through it (smoke), then the
  # integration suites against its database, Auth and Storage.
  docker-integration:
    runs-on: ubuntu-latest
    needs: unit
    # packages: read for the GHCR mirror of the base images (.github/workflows/mirror-images.yml, docker/images.txt):
    # the shared runner IPs exhaust the anonymous pull quota of Docker Hub and ECR Public. The three variables point
    # docker-compose.yml and the Dockerfiles at the mirror; without them they pull from the public registries.
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
      SUPABASE_IMAGE_PREFIX: ghcr.io/${{ github.repository }}/supabase-
      NGINX_IMAGE: ghcr.io/${{ github.repository }}/nginx:1.27-alpine
      NODE_IMAGE: ghcr.io/${{ github.repository }}/node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh local-only secrets for this run (.env.docker is never committed).
      - run: pnpm docker:env
      - run: docker compose --env-file .env.docker up -d --build --wait --wait-timeout 900
      - name: Edge guards and real workflows on the Postgres World (export job, outbox tick, worker deliveries)
        run: |
          set -a; . ./.env.docker; set +a
          pnpm -F worker smoke
      - name: Phase 1 smoke through the edge (the seed job's demo company, the assistant on the mock model)
        run: |
          set -a; . ./.env.docker; set +a
          pnpm -F web exec playwright install --with-deps chromium
          E2E_BASE_URL="http://127.0.0.1:${WEB_HOST_PORT}" DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:${DB_HOST_PORT}/postgres" \
            pnpm -F web exec playwright test e2e/smoke.spec.ts
      - name: Integration suites against the compose stack
        run: |
          # The suites share one outbox and drain it themselves (one package at a time): the worker's tick would
          # drain it under them, so it stops first.
          docker compose --env-file .env.docker stop worker
          set -a; . ./.env.docker; set +a
          export DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:${DB_HOST_PORT}/postgres"
          export TEST_DATABASE_URL="$DATABASE_URL" WORKFLOW_POSTGRES_URL="$DATABASE_URL" WORKFLOW_TARGET_WORLD="@workflow/world-postgres"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:${KONG_HOST_PORT}" SUPABASE_URL="http://127.0.0.1:${KONG_HOST_PORT}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          # The state e-mail test sends to the compose's Mailpit and reads it back (docker-compose.test.yml publishes both sides).
          export TEST_SMTP_PORT="${MAIL_SMTP_HOST_PORT:-56325}" TEST_MAILPIT_URL="http://127.0.0.1:${MAIL_HOST_PORT:-56324}"
          pnpm test:integration
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color --tail 300
      - run: docker compose --env-file .env.docker --profile tools down -v
        if: always()
