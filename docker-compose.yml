# ERP-IA on Docker (design §21, rule 6): the self-hosted Supabase stack (official compose services: Postgres, Auth,
# PostgREST, Storage behind Kong, Mailpit for mail), the web app (Next.js standalone), the Workflow worker (the
# Postgres World's always-on queue consumer + the outbox tick), the init jobs, and the edge (nginx), on one private
# network. The integration job of CI runs against it on every push.
#
#   pnpm docker:env        # once: .env.docker with generated local-only secrets (from .env.docker.example)
#   pnpm docker:up         # build, start, wait until every service is healthy and the init jobs are done
#   pnpm docker:test:up    # the same, plus docker-compose.test.yml: db, API and Mailpit published for host-side tests
#   pnpm docker:down       # stop and drop the volumes
#
# Only the edge is published (127.0.0.1:56300). It refuses /.well-known/workflow/* (the Postgres World's flow route has
# no authentication) and /api/internal/* without `x-workflow-internal-token` (docker/edge/default.conf.template). The
# web app has no published port; the worker and the web app's own deliveries reach it on the private network.
name: erp-ia-stack

x-supabase-env: &supabase-db-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm docker:env}

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      <<: *supabase-db-env
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      JWT_SECRET: ${JWT_SECRET:?run pnpm docker:env}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - ./docker/supabase/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.196.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://127.0.0.1:56321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://127.0.0.1:56300}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://127.0.0.1:56300}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # Sessions are ES256-signed (verified locally by the app against the JWKS); the API keys stay HS256.
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?run pnpm docker:env}
      GOTRUE_JWT_VALID_METHODS: HS256,RS256,ES256
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://127.0.0.1:56321}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: ${MAIL_FROM:-erp@cafedelnorte.test}
      GOTRUE_SMTP_SENDER_NAME: ERP-IA
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_URLPATHS_INVITE: ${API_EXTERNAL_URL:-http://127.0.0.1:56321}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${API_EXTERNAL_URL:-http://127.0.0.1:56321}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${API_EXTERNAL_URL:-http://127.0.0.1:56321}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${API_EXTERNAL_URL:-http://127.0.0.1:56321}/auth/v1/verify
      GOTRUE_PASSWORD_MIN_LENGTH: "6"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      # supabase/config.toml: TOTP MFA and the access token hook (kernel claims, migration 0001).
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/kernel/custom_access_token_hook
      # The app counts sign-in attempts itself (kernel.auth_attempts); the integration suites sign in often.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "360000"
      GOTRUE_RATE_LIMIT_VERIFY: "1000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "1000"
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UPS: "1000"
      GOTRUE_RATE_LIMIT_OTP: "1000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  rest:
    image: public.ecr.aws/supabase/postgrest:v14.17
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    environment:
      # A concrete host (not the default "!4"), which `postgrest --ready` needs for the healthcheck.
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_JWKS:?run pnpm docker:env}
      PGRST_DB_MAX_ROWS: "1000"
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.72.1
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_healthy }
    environment:
      ANON_KEY: ${ANON_KEY:?run pnpm docker:env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?run pnpm docker:env}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      JWT_JWKS: ${JWT_JWKS}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    depends_on:
      auth: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./docker/supabase/kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  mail:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    networks: [internal]

  # One-shot: the app's migrations and seed, once Auth and Storage created their schemas (docker/db-init.sh).
  db-init:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    entrypoint: ["bash", "/docker/db-init.sh"]
    depends_on:
      auth: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    volumes:
      - ./docker/db-init.sh:/docker/db-init.sh:ro
      - ./supabase/migrations:/supabase/migrations:ro
      - ./supabase/seed.sql:/supabase/seed.sql:ro
    restart: "no"
    networks: [internal]

  # One-shot: the Workflow Postgres World's schema (`bootstrap`, node_modules/workflow/docs/worlds/postgres.mdx).
  workflow-init:
    build: { context: ., dockerfile: Dockerfile.worker, target: runner }
    image: erp-ia/worker:local
    command: ["./node_modules/.bin/bootstrap"]
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      WORKFLOW_POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    healthcheck:
      disable: true
    restart: "no"
    networks: [internal]

  # One-shot: the assistant's help index (`pnpm help:index`; FakeEmbedder unless AI_GATEWAY_API_KEY is set), so the
  # help tool answers on this stack.
  help-index:
    build: { context: ., dockerfile: Dockerfile.worker, target: tools }
    image: erp-ia/tools:local
    command: ["pnpm", "help:index"]
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
    restart: "no"
    networks: [internal]

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    image: erp-ia/web:local
    restart: unless-stopped
    depends_on:
      kong: { condition: service_healthy }
      workflow-init: { condition: service_completed_successfully }
      help-index: { condition: service_completed_successfully }
    environment: &app-env
      ERP_TARGET: docker
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://kong:8000
      SUPABASE_URL: http://kong:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run pnpm docker:env}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-erp@cafedelnorte.test}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      # Postgres World queue: every process that enqueues also consumes (world-postgres 5); sized for this stack
      # (pool = concurrency + 2, node_modules/workflow/docs/worlds/postgres.mdx).
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "10"
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: "12"
    # No published port: the edge is the way in.
    networks: [internal]

  worker:
    image: erp-ia/worker:local
    restart: unless-stopped
    depends_on:
      workflow-init: { condition: service_completed_successfully }
      web: { condition: service_healthy }
    environment:
      <<: *app-env
      # Where the Postgres World delivers workflow and step invocations: the web app's flow route.
      WORKFLOW_LOCAL_BASE_URL: http://web:3000
      # The name its delivery log carries (apps/worker/src/delivery-log.ts).
      WORKER_NAME: worker
    networks: [internal]

  # The only published service: the app through nginx, with the workflow and internal routes behind a token.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?run pnpm docker:env}
      NGINX_ENVSUBST_FILTER: ^WORKFLOW_INTERNAL_TOKEN$$
    volumes:
      - ./docker/edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-56300}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/edge-health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # The Workflow dashboard (`@workflow/web`): opt-in (`docker compose --profile tools up -d workflow-web`).
  # WARNING: it has NO authentication and shows every run's input and output (claims, exported data). It is bound to
  # 127.0.0.1 only and must never be published on another interface or behind the edge without an auth layer.
  workflow-web:
    image: erp-ia/worker:local
    profiles: [tools]
    command: ["./node_modules/.bin/workflow", "web", "--backend", "@workflow/world-postgres", "--webPort", "3456", "--noBrowser"]
    depends_on:
      workflow-init: { condition: service_completed_successfully }
    environment:
      WORKFLOW_POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:${WORKFLOW_WEB_HOST_PORT:-56456}:3456"
    networks: [internal]

networks:
  internal: {}

volumes:
  db-data: {}
  storage-data: {}
