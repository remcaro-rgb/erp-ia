# The Docker TEST stack (CI `docker-integration`, `pnpm docker:test:up`, the smoke checks), never a deployment:
#  * publishes the database, the Supabase API and Mailpit on 127.0.0.1, which the plain stack keeps on its network;
#  * loads the demo company: supabase/seed.sql in the `db-init` job and the `seed` job (`pnpm db:seed` with DEMO_SEED=1:
#    laura@demo.local, marcela@demo.local and andres@demo.local, public passwords, README.md; it also posts the 2026 demo ledger of
#    Contabilidad through the accounting processes), which the web app waits for;
#  * runs the assistant on the AI SDK mock model (the smoke needs no provider), allowed on this production build by
#    ALLOW_MOCK_MODEL=1, unless AGENT_MODEL says otherwise.
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-56322}:5432"
  kong:
    ports:
      - "127.0.0.1:${KONG_HOST_PORT:-56321}:8000"
  mail:
    ports:
      - "127.0.0.1:${MAIL_HOST_PORT:-56324}:8025"
  db-init:
    volumes:
      - ./supabase/seed.sql:/supabase/seed.sql:ro
  # One-shot: the demo company (`pnpm db:seed`, scripts/seed.ts, Task 22) once the migrations, supabase/seed.sql and Auth
  # are in: the registry synced, the modules (core, support, accounting) enabled, the Auth users created through the Admin API
  # (kong), people and permissions through the admin processes, 6 categories, 40 parties and 25 products through theirs, then the
  # Contabilidad demo ledger (Task 31: chart, masters, opening balances, 40 posted comprobantes, closed periods). Idempotent.
  seed:
    # The tools image the help-index job builds.
    image: erp-ia/tools:local
    pull_policy: never  # built by its sibling service above; a pull of a local-only tag fails (CI, 2026-10-29)
    command: ["pnpm", "db:seed"]
    depends_on:
      db-init: { condition: service_completed_successfully }
      kong: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      DEMO_SEED: "1"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SUPABASE_URL: http://kong:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    restart: "no"
    networks: [internal]
  web:
    depends_on:
      seed: { condition: service_completed_successfully }
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-mock}
      ALLOW_MOCK_MODEL: "1"
