<style>
  /* ---------- tokens: shell v7 (packages/ui/src/styles/tokens.css) + prototype-only extras ---------- */
  :root {

  * { box-sizing: border-box; }

  .btn.ghost { border: 0; background: transparent; color: var(--muted); }
  .btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
  .btn.danger { color: var(--danger); border-color: var(--danger-bg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 4px; white-space: nowrap; display: inline-block; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.danger { background: var(--danger-bg); color: var(--danger); } .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.gray { background: var(--line-2); color: var(--muted); } .pill.blue { background: var(--accent); color: var(--link); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea, .inp { padding: 7px 10px; border: 1px solid var(--line-input); border-radius: 6px; background: var(--surface); font-size: 13px; color: var(--text); min-width: 0; width: 100%; }
  .field input:disabled, .field select:disabled, .inp:disabled { background: var(--head); color: var(--muted); border-color: var(--line); }
  .field .err { font-size: 11px; color: var(--danger); font-weight: 600; }
  .masked { color: var(--muted); letter-spacing: 1px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex-grow: 1; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--line-input); border: 0; flex: 0 0 auto; padding: 0; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle.on { background: var(--primary); } .toggle.on::after { left: 19px; }
  .toggle:disabled { opacity: .5; cursor: not-allowed; }
  .sw { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .note { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.45; }

  .note.bad { background: var(--danger-bg); color: var(--danger); }

  /* ---------- prototype index and controls (not part of the product) ---------- */
  .proto { display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--proto-bg); color: var(--proto-text); border-bottom: 1px dashed var(--proto-line); font-size: 12px; flex: none; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .proto a { color: var(--proto-text); padding: 3px 7px; border-radius: 4px; border: 1px solid transparent; }
  .proto a:hover, .proto a.on { border-color: var(--proto-line); background: var(--surface); color: var(--text); }
  .proto select { display: none; padding: 4px 6px; border: 1px solid var(--proto-line); border-radius: 4px; background: var(--surface); font-size: 12px; min-width: 150px; flex: 1 1 auto; }
  .proto .dec { margin-left: auto; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--proto-line); background: var(--surface); color: var(--text); font-weight: 600; font-size: 12px; }
  .proto .dec i { font-style: normal; background: var(--alert); color: #1A1D21; border-radius: 8px; padding: 0 6px; margin-left: 4px; }
  .ctl { border: 1px dashed var(--proto-line); background: var(--proto-bg); color: var(--proto-text); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 12px; }
  .ctl b.t { font-weight: 700; width: 100%; }
  .ctl label { display: inline-flex; gap: 6px; align-items: center; }
  .ctl select { padding: 4px 6px; border: 1px solid var(--proto-line); border-radius: 4px; background: var(--surface); color: var(--text); font-size: 12px; }
  .ctl .toggle { width: 32px; height: 18px; } .ctl .toggle::after { width: 12px; height: 12px; } .ctl .toggle.on::after { left: 17px; }
  .ctl .btn { border-color: var(--proto-line); }

  /* ---------- shell v7 ---------- */
  .app { display: flex; flex-direction: column; height: 100dvh; }
  .bar { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--bar); color: var(--bar-text); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; margin-right: 6px; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--primary); display: inline-block; }
  .bar-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--bar-line); background: transparent; color: var(--bar-text); border-radius: 6px; padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  .bar-btn:hover { background: var(--bar-ctl); }
  .bar-btn.solid { background: var(--accent); border-color: var(--accent-line); color: var(--link); font-weight: 600; max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .bar-btn.white { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--bar-line); background: transparent; color: var(--bar-text); border-radius: 6px; position: relative; flex: none; }
  .icon-btn:hover { background: var(--bar-ctl); }
  .dot { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #EF4444; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .cmd { flex: 0 1 300px; min-width: 120px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--bar-line); background: var(--bar-ctl); color: var(--bar-text); border-radius: 6px; padding: 6px 10px; font-size: 13px; text-align: left; }
  .cmd span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd kbd { font-family: "JetBrains Mono", monospace; font-size: 11px; border: 1px solid var(--bar-line); border-radius: 4px; padding: 0 5px; color: var(--bar-dim); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; border: 0; flex: none; }
  #menuBtn { display: none; }
  .body { display: flex; flex: 1; min-height: 0; position: relative; }
  .col { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  /* left side menu: module names only */
  .rail { width: var(--rail-w); flex: none; display: flex; flex-direction: column; background: var(--rail); border-right: 1px solid var(--line); overflow: hidden; }
  .rail-head { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line-2); }
  .rail-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .rail nav { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; overflow-y: auto; }
  .rail-item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--rail-text); font-size: 14px; font-weight: 600; text-align: left; white-space: nowrap; }
  .rail-item:hover { background: var(--hover); color: var(--text); }
  .rail-item[aria-current="page"] { background: var(--rail-active); color: var(--rail-active-text); }
  .rail-close { display: none; }
  .rail-toggle { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); flex: none; }
  .rail-toggle:hover { background: var(--hover); color: var(--text); }
  .rail-toggle svg { transition: transform .15s; }
  .rail { transition: width .15s ease; }
  @media (min-width: 1024px) { .app.rail-c .rail { width: var(--rail-w-collapsed); } .app.rail-c .rail .rail-label, .app.rail-c .rail .rail-title { display: none; } .app.rail-c .rail .rail-item { justify-content: center; padding: 0; } .app.rail-c .rail-head { justify-content: center; padding: 0; } .app.rail-c .rail-toggle svg { transform: rotate(180deg); } }
  @media (max-width: 1023px) { .rail-toggle { display: none; } }
  /* items bar: the active module's four sections */
  .itemsbar { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow: hidden; }
  .itemsbar .modname { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding-right: 10px; margin-right: 4px; border-right: 1px solid var(--line-2); white-space: nowrap; }
  .secbtn { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 11px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap; flex: none; }
  .secbtn:hover { background: var(--hover); color: var(--text); }
  .secbtn.on { background: var(--head); border-color: var(--line); color: var(--link); font-weight: 600; }
  .gmenu { position: fixed; z-index: 60; min-width: 230px; max-width: calc(100vw - 16px); padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px var(--shadow); display: flex; flex-direction: column; }
  .gmenu .mh { padding: 6px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .gmenu button { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; text-align: left; white-space: nowrap; }
  .gmenu button:hover { background: var(--head); } .gmenu button.on { background: var(--accent); font-weight: 600; }
  .gmenu .empty { margin: 4px; padding: 12px 10px; font-size: 13px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 6px; }
  .gmenu hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; width: 100%; }
  /* tabs row */
  .tabs { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: var(--tabrow); border-bottom: 1px solid var(--tabrow-line); overflow-x: auto; scrollbar-width: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--tabrow-text); font-size: 13px; white-space: nowrap; }
  .tab:hover { background: var(--tabrow-hover); }
  .tab.on { background: var(--accent); color: var(--link); font-weight: 600; }
  .tab .x { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; opacity: .7; }
  .tab .x:hover { background: var(--tabrow-hover); opacity: 1; }
  .tab .uns { width: 7px; height: 7px; border-radius: 50%; background: var(--alert); display: inline-block; }
  main { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  main > * { flex-shrink: 0; }
  aside.side { flex: 0 0 400px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .side .sh { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); font-weight: 700; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .side .sb { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
  .backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 40; }

  /* ---------- tables ---------- */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 0 12px; height: 36px; text-align: left; border-bottom: 1px solid var(--line-2); font-size: 13px; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--head); }
  td.r, th.r { text-align: right; } td.c, th.c { text-align: center; }
  tbody tr:hover td { background: var(--hover); }
  tr.sel td { background: var(--accent) !important; }
  tr.click { cursor: pointer; }
  tfoot td { background: var(--head); font-weight: 700; }
  td .inp { padding: 5px 8px; }
  input[type=checkbox] { accent-color: var(--primary); width: 16px; height: 16px; }
  .exp { font-weight: 700; font-size: 11px; } .exp.pdf { color: #C2261C; } .exp.xls { color: #107C41; } .exp.csv { color: var(--muted); }

  /* ---------- record frame ---------- */
  .rec { display: flex; flex-direction: column; }

  .rec .mh .tt { font-weight: 700; font-size: 16px; }
  .ids { font-size: 11px; color: var(--muted); font-family: "JetBrains Mono", monospace; display: flex; gap: 10px; flex-wrap: wrap; }
  .ftabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 18px; overflow-x: auto; scrollbar-width: thin; }
  .ftabs button { padding: 10px 12px; border: 0; background: transparent; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .ftabs button.on { color: var(--link); border-bottom-color: var(--link); font-weight: 600; }
  .ftabs .cnt { font-size: 11px; background: var(--line-2); color: var(--muted); padding: 0 6px; border-radius: 8px; }
  .ftabs .adm { font-size: 10px; background: var(--warn-bg); color: var(--warn); padding: 0 5px; border-radius: 4px; }
  .note.refusal { margin: 12px 18px 0; }
  .rec .mb { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .rec .mf { display: flex; gap: 8px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line-2); background: var(--head); flex-wrap: wrap; position: sticky; bottom: 0; border-radius: 0 0 14px 14px; }
  .actbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .actbar.main { margin-left: auto; }
  .more-wrap { position: relative; display: none; }
  .more-menu { position: absolute; bottom: calc(100% + 4px); right: 0; min-width: 180px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px var(--shadow); z-index: 30; }
  .more-menu button { display: flex; width: 100%; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; }
  .foot-status { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); min-width: 180px; }
  .foot-status .uns { color: var(--warn); font-weight: 600; }
  .sec { display: flex; flex-direction: column; gap: 10px; }

/* =====================================================================================================================
   Grid engine (rule 20): sort by every column, filter per column, advanced filter (Y/O, AND first), pagination, PDF/XLSX/CSV
   ===================================================================================================================== */
const S_GS = {}; const GRID_DEF = {};
const gst = id => S_GS[id] || (S_GS[id] = { sort: null, dir: 1, page: 0, size: 10, cf: {}, adv: [], showF: false });
function ruleOk(r, cols, row) {
  const c = cols.find(c => c.k === r.f); if (!c || r.val === '') return true; const v = c.v(row);
  if (typeof v === 'number') { const q = parseFloat(String(r.val).replace(/\$|\s/g, '').replace(/\./g, '').replace(',', '.')); if (isNaN(q)) return true; return r.op === '=' ? v === q : r.op === '≠' ? v !== q : r.op === '>' ? v > q : v < q; }
  const a = String(v).toLowerCase(), q = String(r.val).toLowerCase();
  return r.op === 'contiene' ? a.includes(q) : r.op === 'empieza' ? a.startsWith(q) : r.op === '=' ? a === q : a !== q;
}
function advMatch(rules, cols, row) { const groups = [[]]; rules.forEach((r, i) => { if (i && r.join === 'O') groups.push([]); groups[groups.length - 1].push(r); }); return groups.some(g => g.every(r => ruleOk(r, cols, row))); }
function gridRows(id, cols, rows) {
  const g = gst(id);
  let r = rows.filter(row => cols.every(c => { const f = g.cf[c.k]; return !f || String(c.v(row)).toLowerCase().includes(f.toLowerCase()); }));
  if (g.adv.length) r = r.filter(row => advMatch(g.adv, cols, row));
  if (g.sort) { const c = cols.find(c => c.k === g.sort); if (c) r = r.slice().sort((a, b) => { const x = c.v(a), y = c.v(b); return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true })) * g.dir; }); }
  return r;
}
function exportBtns(name) { return [['PDF', 'pdf', 'ic-pdf'], ['XLSX', 'xls', 'ic-xls'], ['CSV', 'csv', 'ic-csv']].map(([l, k, c]) => `<button class="btn sm exp-btn" aria-label="Exportar a ${l}" title="Exportar a ${l}" onclick="toast('Exportar «${esc(name)}» a ${l}: columnas visibles en su orden, todas las páginas','kernel.grid.export')">${ic('filetype', c)}<span class="exp ${k}">${l}</span></button>`).join(''); }
function gridHtml(id, cols, rows, o = {}) {
  GRID_DEF[id] = { cols, rows }; const g = gst(id); const all = gridRows(id, cols, rows);
  const pages = Math.max(1, Math.ceil(all.length / g.size)); if (g.page >= pages) g.page = pages - 1;
  const vis = all.slice(g.page * g.size, (g.page + 1) * g.size); const nf = Object.values(g.cf).filter(Boolean).length + g.adv.length;
  const tools = `<div class="gtools">${o.left || ''}<span class="grow"></span><button class="btn sm ${g.showF ? 'on' : ''}" aria-pressed="${g.showF}" onclick="gst('${id}').showF=!gst('${id}').showF;render()">${ic('filter')}Filtros por columna</button><button class="btn sm ${g.adv.length ? 'on' : ''}" aria-haspopup="dialog" onclick="openAdv('${id}')">${ic('funnel')}Filtro avanzado${g.adv.length ? `<span class="cnt">${g.adv.length}</span>` : ''}</button>${nf ? `<button class="btn sm ghost" onclick="clearF('${id}')">Quitar filtros</button>` : ''}${exportBtns(o.name || id)}</div>`;
  const cls = c => c.r ? 'r' : c.c ? 'c' : '';
  const head = `<tr>${cols.map(c => c.nosort ? `<th class="${cls(c)}">${c.l}</th>` : `<th class="${cls(c)}" aria-sort="${g.sort === c.k ? (g.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button class="sortb" title="Ordenar por ${esc(c.l)}" onclick="sortBy('${id}','${c.k}')">${c.l}<span class="si" aria-hidden="true">${g.sort === c.k ? (g.dir > 0 ? '▲' : '▼') : '↕'}</span></button></th>`).join('')}</tr>`;
  const frow = g.showF ? `<tr class="frow">${cols.map(c => `<th>${c.nofilter ? '' : `<input class="inp" data-gf="${id}:${c.k}" aria-label="Filtrar ${esc(c.l)}" placeholder="Filtrar…" value="${esc(g.cf[c.k] || '')}" oninput="colF('${id}','${c.k}',this.value)">`}</th>`).join('')}</tr>` : '';
  const body = vis.length ? vis.map(x => `<tr class="${o.click ? 'click' : ''} ${o.sel && o.sel(x) ? 'sel' : ''}" ${o.click ? `onclick="${o.click(x)}"` : ''}>${cols.map(c => `<td class="${c.r ? 'r num' : c.c ? 'c' : ''} ${c.wrap ? 'wrap' : ''}">${c.h ? c.h(x) : esc(c.v(x))}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="muted">${rows.length ? 'Sin resultados con estos filtros' : (o.empty || 'Sin registros')}</td></tr>`;
  const from = all.length ? g.page * g.size + 1 : 0, to = Math.min(all.length, (g.page + 1) * g.size);
  const pager = `<div class="pager"><span>${from}–${to} de ${all.length}${all.length !== rows.length ? ` (filtrado de ${rows.length})` : ''}</span><label>Filas <select aria-label="Filas por página" onchange="gst('${id}').size=+this.value;gst('${id}').page=0;render()">${[10, 25, 50].map(n => `<option ${n === g.size ? 'selected' : ''}>${n}</option>`).join('')}</select></label><button class="btn sm" aria-label="Página anterior" ${g.page ? '' : 'disabled'} onclick="gst('${id}').page--;render()">‹</button><span>Página ${g.page + 1} de ${pages}</span><button class="btn sm" aria-label="Página siguiente" ${g.page < pages - 1 ? '' : 'disabled'} onclick="gst('${id}').page++;render()">›</button></div>`;
  return `<div class="grid">${tools}<div class="gscroll"><table><thead>${head}${frow}</thead><tbody>${body}</tbody>${o.foot ? `<tfoot>${o.foot}</tfoot>` : ''}</table></div>${pager}</div>`;
}
function sortBy(id, k) { const g = gst(id); if (g.sort !== k) { g.sort = k; g.dir = 1; } else if (g.dir === 1) g.dir = -1; else { g.sort = null; g.dir = 1; } render(); }
function colF(id, k, v) { const g = gst(id); g.cf[k] = v; g.page = 0; render(); const el = document.querySelector(`[data-gf="${id}:${k}"]`); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }
function clearF(id) { const g = gst(id); g.cf = {}; g.adv = []; g.page = 0; render(); }
function isNum(id, k) { const { cols, rows } = GRID_DEF[id]; const c = cols.find(c => c.k === k); return !!(c && rows.length && typeof c.v(rows[0]) === 'number'); }
const advCols = id => GRID_DEF[id].cols.filter(c => !c.nofilter && c.l);
function defRule(id) { const f = advCols(id)[0].k; return { join: 'Y', f, op: isNum(id, f) ? '=' : 'contiene', val: '' }; }
function openAdv(id) { const g = gst(id); S.adv = { id, rules: g.adv.length ? JSON.parse(JSON.stringify(g.adv)) : [defRule(id)] }; renderAdv(); }
function renderAdv() {
  const { id, rules } = S.adv; const cols = advCols(id);
  openDialog(`<div class="dh">${ic('funnel')}Filtro avanzado<span class="grow"></span><button class="btn ghost" aria-label="Cerrar" onclick="closeDialog()">${ic('x')}</button></div>
  <div class="db"><p class="hint">Cada campo con reglas según su tipo. Combina con Y / O; «Y» se evalúa antes que «O»: A Y B O C = (A Y B) O C.</p>
  ${rules.map((r, i) => { const num = isNum(id, r.f); const ops = num ? ['=', '≠', '>', '<'] : ['contiene', 'empieza', '=', '≠']; return `<div class="adv-rule">${i ? `<select class="inp" aria-label="Unión de la regla ${i + 1}" onchange="S.adv.rules[${i}].join=this.value;advLive()"><option ${r.join === 'Y' ? 'selected' : ''}>Y</option><option ${r.join === 'O' ? 'selected' : ''}>O</option></select>` : '<span class="lbl">Donde</span>'}
    <select class="inp" aria-label="Campo de la regla ${i + 1}" onchange="S.adv.rules[${i}].f=this.value;S.adv.rules[${i}].op=isNum('${id}',this.value)?'=':'contiene';renderAdv()">${cols.map(c => `<option value="${c.k}" ${c.k === r.f ? 'selected' : ''}>${c.l}</option>`).join('')}</select>
    <select class="inp" aria-label="Operador de la regla ${i + 1}" onchange="S.adv.rules[${i}].op=this.value;advLive()">${ops.map(x => `<option ${x === r.op ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <input class="inp" aria-label="Valor de la regla ${i + 1}" value="${esc(r.val)}" placeholder="${num ? 'Número' : 'Texto'}" oninput="S.adv.rules[${i}].val=this.value;advLive()">
    <button class="btn sm ghost" aria-label="Quitar la regla ${i + 1}" onclick="S.adv.rules.splice(${i},1);if(!S.adv.rules.length)S.adv.rules.push(defRule('${id}'));renderAdv()">${ic('x')}</button></div>`; }).join('')}
  <div class="row"><button class="btn sm" onclick="S.adv.rules.push(defRule('${id}'));renderAdv()">${ic('plus')}Agregar regla</button><span class="grow"></span><b id="adv-count" aria-live="polite"></b></div></div>
  <div class="df"><button class="btn" onclick="S.adv.rules=[];applyAdv()">Limpiar</button><button class="btn" onclick="closeDialog()">Cancelar</button><button class="btn dark" onclick="applyAdv()">Aplicar</button></div>`);
  advLive();
}
function advLive() { const { id, rules } = S.adv; const { cols, rows } = GRID_DEF[id]; const n = rows.filter(r => advMatch(rules.filter(x => x.val !== ''), cols, r)).length; const el = document.getElementById('adv-count'); if (el) el.textContent = `${n} resultado${n === 1 ? '' : 's'}`; }

const ACTIONS = ['save', 'submit', 'approve', 'reject', 'post', 'void', 'delete'];
const approval = f => f.requiresApproval, postsNoApproval = f => f.posts && !f.requiresApproval, postsAfterApproval = f => f.posts && f.requiresApproval;

  draft: { save: { to: 'saved' }, delete: { to: 'deleted' } },
  saved: { save: { to: 'saved' }, submit: { to: 'pending', when: approval }, post: { to: 'posted', when: postsNoApproval }, void: { to: 'voided' } },
  pending: { approve: { to: 'approved' }, reject: { to: 'rejected' }, void: { to: 'voided' } },
  rejected: { save: { to: 'saved' }, void: { to: 'voided' } },
  approved: { post: { to: 'posted', when: postsAfterApproval }, void: { to: 'voided' } },
  posted: {}, voided: {},
};
const T_MAE = {
  draft: { save: { to: 'saved' }, delete: { to: 'deleted' } },
  saved: { save: { to: 'saved' }, submit: { to: 'pending', when: approval }, delete: { to: 'deleted' } },
  pending: { save: { to: 'pending' }, approve: { to: 'approved' }, reject: { to: 'rejected' }, delete: { to: 'deleted' } },
  rejected: { save: { to: 'saved' }, delete: { to: 'deleted' } },
  approved: { save: { to: 'approved' }, submit: { to: 'pending', when: approval }, delete: { to: 'deleted' } },
  posted: {}, voided: {},
};
function nextStatus(type, from, action, flags) { const r = (type === 'maestro' ? T_MAE : T_DOC)[from]?.[action]; if (!r) return null; if (r.when && !r.when(flags)) return null; return r.to; }
const allowedActions = (type, status, flags) => ACTIONS.filter(a => nextStatus(type, status, a, flags) !== null);
const canEditData = (type, status) => type === 'maestro' || ['draft', 'saved', 'rejected'].includes(status);
const isUsable = (status, active, flags) => active && (flags.requiresApproval ? status === 'approved' : status === 'saved');

const ST = { draft: 'Borrador', saved: 'Grabado', pending: 'Pendiente de Aprobación', rejected: 'No Aprobado', approved: 'Aprobado', posted: 'Contabilizado', voided: 'Anulado' };

/* states each flag set can show (the pass-through ones are left out: Grabado when Guardar posts, Aprobado when Aprobar posts) */
function docStates(f) {
  const s = ['draft'];
  if (!(f.posts && !f.requiresApproval)) s.push('saved');
  if (f.requiresApproval) s.push('pending', 'rejected');
  if (f.requiresApproval && !f.posts) s.push('approved');
  if (f.posts) s.push('posted');
  if (!(f.posts && !f.requiresApproval)) s.push('voided');
  return s;
}
function maeStates(f) { const s = ['draft', 'saved']; if (f.requiresApproval) s.push('pending', 'rejected', 'approved'); return s; }

/* D15: the state buttons of the bar, derived from allowedActions. `post` is never a button (D8, automatic). With approval required the bar
   shows «Guardar» and «Guardar y enviar a aprobación» while the data is editable before approval; «Enviar a aprobación» alone only in Grabado.
   An Aprobado maestro offers only «Guardar»: an approval-relevant change sends it back to Pendiente automatically (D10). */
function barSpec(type, status, f) {
  const acts = allowedActions(type, status, f); const out = [];
  const preApproval = ['draft', 'saved', 'rejected'].includes(status);
  if (acts.includes('save') && canEditData(type, status)) {
    if (f.requiresApproval && preApproval) { out.push({ a: 'save', l: 'Guardar' }); out.push({ a: 'save_submit', l: 'Guardar y enviar a aprobación', primary: true }); }
    else out.push({ a: 'save', l: 'Guardar', primary: true });
  }
  if (acts.includes('submit') && status === 'saved') out.push({ a: 'submit', l: 'Enviar a aprobación', state: true });
  if (acts.includes('approve')) out.push({ a: 'approve', l: 'Aprobar', state: true, ok: true });
  if (acts.includes('reject')) out.push({ a: 'reject', l: 'No Aprobar', state: true, danger: true });
  if (acts.includes('void')) out.push({ a: 'void', l: 'Anular', state: true, danger: true });
  if (acts.includes('delete')) out.push({ a: 'delete', l: 'Eliminar', danger: true });
  if (acts.includes('post')) out.push({ a: 'post', l: 'contabiliza automático', auto: true });
  if (type === 'maestro' && status === 'approved' && acts.includes('submit')) out.push({ a: 'auto', l: 'vuelve a Pendiente si cambia un dato de aprobación (D10)', auto: true });
  return out;
}

}
function blockEditor(b, i) {
  const num = (k, l) => `<div class="field"><label>${l}</label><input type="number" min="0" max="1700" value="${b[k] ?? ''}" oninput="S.tpl.blocks[${i}].${k}=+this.value||undefined;tplSoft()"></div>`;
  let val = '';
  if (b.kind === 'text') val = `<div class="field w4"><label>Texto</label><input value="${esc(b.value)}" oninput="S.tpl.blocks[${i}].value=this.value;tplSoft()"></div>`;
  if (b.kind === 'variable') val = `<div class="field w4"><label>Variable</label><select onchange="S.tpl.blocks[${i}].value=this.value;tplDirty()">${SYS_VARS.filter(v => v !== 'empresa.logo').map(v => `<option ${v === b.value ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
  if (b.kind === 'field') val = `<div class="field w4"><label>Campo</label><select onchange="S.tpl.blocks[${i}].value=this.value;tplDirty()">${Object.entries(REC_FIELDS).map(([k, l]) => `<option value="${k}" ${k === b.value ? 'selected' : ''}>${l} · ${k}</option>`).join('')}</select></div>`;
  if (b.kind === 'image') val = `<div class="field w4"><label>Imagen</label><select><option>empresa.logo</option></select></div>`;
  if (b.kind === 'page_number') val = `<div class="field w4"><label>Formato</label><input value="${esc(b.value || 'Página {n} de {total}')}" oninput="S.tpl.blocks[${i}].value=this.value;tplSoft()"></div>`;
  if (b.kind === 'lines') val = `<div class="field w4"><label>Columnas</label><div class="row">${Object.entries(LINE_COLS).map(([k, l]) => `<label class="sw small"><input type="checkbox" ${(b.columns || []).includes(k) ? 'checked' : ''} onchange="toggleCol(${i},'${k}',this.checked)">${l}</label>`).join('')}</div></div>`;
  const font = b.kind === 'lines' || b.kind === 'image' ? '' : `<div class="field"><label>Tamaño</label><input type="number" min="4" max="72" value="${(b.font && b.font.size) || 10}" oninput="S.tpl.blocks[${i}].font={...(S.tpl.blocks[${i}].font||{}),size:+this.value||10};tplSoft()"></div>
    <div class="field"><label>Negrita</label><select onchange="S.tpl.blocks[${i}].font={...(S.tpl.blocks[${i}].font||{size:10}),bold:this.value==='1'};tplDirty()"><option value="0">No</option><option value="1" ${b.font && b.font.bold ? 'selected' : ''}>Sí</option></select></div>
    <div class="field w2"><label>Alineación</label><select onchange="S.tpl.blocks[${i}].align=this.value;tplDirty()">${[['left', 'Izquierda'], ['center', 'Centro'], ['right', 'Derecha']].map(([k, l]) => `<option value="${k}" ${(b.align || 'left') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
  return `<div class="be">${val}${num('x', 'X (pt)')}${num('y', 'Y (pt)')}${num('w', 'Ancho')}${num('h', 'Alto')}${font}</div>`;
}
function tplDirty() { S.tpl.dirty = true; render(); }
function tplSoft() { S.tpl.dirty = true; fitPreview(); const v = document.getElementById('tpl-ver'); if (v) v.textContent = `al guardar será v${S.tpl.version + 1}`; const g = document.getElementById('tpl-save'); if (g) g.disabled = false; }
function mvBlock(i, d) { const a = S.tpl.blocks; const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; S.tpl.sel = j; tplDirty(); }
function toggleCol(i, k, on) { const b = S.tpl.blocks[i]; b.columns = Object.keys(LINE_COLS).filter(c => c === k ? on : (b.columns || []).includes(c)); tplDirty(); }
function addBlock(kind, value) { const b = { kind, x: 40, y: 600, w: kind === 'lines' ? 532 : 200, font: { size: 10 } }; if (value) b.value = value; if (kind === 'text') b.value = 'Texto nuevo'; if (kind === 'variable' && !value) b.value = 'empresa.nombre'; if (kind === 'field' && !value) b.value = 'referencia'; if (kind === 'image') { b.value = 'empresa.logo'; b.w = 70; b.h = 44; delete b.font; } if (kind === 'page_number') b.value = 'Página {n} de {total}'; if (kind === 'lines') { b.columns = ['cuenta', 'debito', 'credito']; delete b.font; b.y = 470; } S.tpl.blocks.push(b); S.tpl.sel = S.tpl.blocks.length - 1; tplDirty(); toast(`Bloque agregado: ${KIND_L[kind]}${value ? ' · ' + value : ''}`); }
function setBg(file) { if (!file) return; if (file.name && !/\.pdf$/i.test(file.name)) { toast('El fondo debe ser un PDF'); return; } S.tpl.bg = file.name; tplDirty(); toast('Fondo cargado (en el prototipo se simula el membrete)'); }

/* =====================================================================================================================
   Administración · Acceso al menú
   ===================================================================================================================== */
S.menuSel = 'acc.parametros.plantillas';
S.menuRules = { 'acc.parametros.plantillas': [{ kind: 'role', who: 'Contador', allowed: true }, { kind: 'role', who: 'Tesorería', allowed: false }], 'acc.reportes': [{ kind: 'user', who: 'Marcela Ruiz', allowed: false }] };
function viewMenuAccess() {
  const tree = [];
  Object.entries(MODULES).forEach(([mid, m]) => { tree.push([mid, m.name, 0]); SECTIONS.forEach(([k, l]) => { tree.push([`${mid}.${k}`, l, 1]); m.sections[k].forEach(([id, t]) => tree.push([`${mid}.${k}.${id}`, t, 2])); }); });
  const label = (tree.find(x => x[0] === S.menuSel) || [, S.menuSel])[1];
  const rules = S.menuRules[S.menuSel] || [];
  return `<div class="row"><h1>Acceso al menú</h1><span class="pill blue">Administración › Parámetros</span></div>
  <div class="note info"><b>Las reglas solo restringen; no aplican a administradores.</b> Una regla «Permitido» nunca muestra un elemento que el rol no puede abrir. Un elemento oculto también se rechaza en el servidor (sus pantallas y procesos).</div>
  <div class="ted macc">
    <section class="card" style="padding:8px;max-height:560px;overflow:auto">${tree.map(([id, l, lv]) => `<button style="display:flex;width:100%;gap:6px;align-items:center;text-align:left;border:0;border-radius:6px;padding:7px 8px 7px ${8 + lv * 18}px;background:${id === S.menuSel ? 'var(--accent)' : 'transparent'};font-weight:${lv < 2 ? 700 : 400};font-size:13px;min-height:32px" onclick="S.menuSel='${id}';render()">${l}${S.menuRules[id] && S.menuRules[id].length ? `<span class="pill warn" style="margin-left:auto">${S.menuRules[id].length} regla${S.menuRules[id].length > 1 ? 's' : ''}</span>` : ''}</button>`).join('')}</section>
    <section class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><h2>${esc(label)}</h2>
      ${menuRulesGrid()}
      <div class="row"><select class="inp" id="m-new" style="width:auto"><option value="role:Contador">Rol · Contador</option><option value="role:Tesorería">Rol · Tesorería</option><option value="role:Vendedor">Rol · Vendedor</option><option value="user:Marcela Ruiz">Usuario · Marcela Ruiz</option><option value="user:Sofía Rincón">Usuario · Sofía Rincón</option></select><button class="btn" onclick="const [k,w]=document.getElementById('m-new').value.split(':');(S.menuRules[S.menuSel]=S.menuRules[S.menuSel]||[]).push({kind:k,who:w,allowed:true});render()">${ic('plus')}Agregar regla</button><span class="grow"></span><button class="btn dark" onclick="toast('Reglas del menú guardadas (proceso auditado)','kernel.menu_access.set')">Guardar</button></div>
      <p class="hint">Una regla en un módulo o en una sección aplica a todo lo que está debajo.</p></section>
  </div>`;
}

applyTheme(); render(); applyRail();
</script>
