<style>
  :root {

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  a { color: var(--primary); text-decoration: none; }

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) svg.ic-pdf { color: #F28B82; } :root:not([data-theme="light"]) svg.ic-xls { color: #6BCB8B; } :root:not([data-theme="light"]) svg.ic-csv { color: #B0BAC8; } }

  .btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; line-height: 1.2; display: inline-flex; align-items: center; }

  .btn.dark:hover { background: var(--primary-h); }

  .pill.danger { background: var(--danger-bg); color: var(--danger); } .pill.info { background: var(--info-bg); color: var(--info); }
  .pill.gray { background: var(--line-2); color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }

  .field input:focus, .field select:focus, .field textarea:focus, .btn:focus-visible, .inp:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .field input.bad, .inp.bad { border-color: var(--danger); background: var(--danger-bg); }
  .field .err { font-size: 11px; color: var(--danger); font-weight: 600; }

  .row { display: flex; align-items: center; gap: 8px; }

  .verify { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .verify button { font-size: 11px; padding: 1px 6px; border: 1px dashed var(--line); background: transparent; border-radius: 4px; color: var(--muted); }

  /* login */
  #login { height: 100%; display: grid; place-items: center; background: radial-gradient(1200px 600px at 20% -10%, #2A4A9E 0, #1E3A8A 40%, #0F2159 100%); }
  .login-card { width: 400px; background: var(--surface); border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .pw { position: relative; display: flex; } .pw input { flex: 1 1 auto; padding-right: 40px !important; width: 100%; }
  .pw .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 28px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; border-radius: 4px; } .pw .eye:hover { background: var(--head); color: var(--text); }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; cursor: pointer; line-height: 1; }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); flex: 0 0 auto; }
  .totp { display: flex; gap: 8px; justify-content: space-between; }
  .totp input { width: 48px; height: 52px; text-align: center; font-size: 22px; font-family: "JetBrains Mono", monospace; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .totp input:focus { border-color: var(--primary); outline: 2px solid var(--focus); }

  /* shell */
  #app { height: 100%; display: flex; flex-direction: column; }
  header.bar { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 48px; background: var(--bar); color: var(--bar-text); flex: 0 0 auto; position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: 6px; font-weight: 700; font-size: 15px; color: #fff; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: #60A5FA; display: inline-block; }
  .bar-btn { padding: 6px 10px; background: var(--bar-ctl); color: #fff; border: 0; border-radius: 6px; font-size: 13px; white-space: nowrap; }
  header.bar .brand { white-space: nowrap; }
  .bar-btn.outline { background: transparent; color: #C9D6F0; border: 1px solid var(--bar-line); }
  .bar-btn.white { background: #fff; color: #1E3A8A; font-weight: 600; }
  #cmd { width: 200px; padding: 7px 12px; border: 1px solid var(--bar-line); border-radius: 6px; background: var(--bar-ctl); color: #fff; font-size: 13px; }
  #cmd::placeholder { color: #C9D6F0; }
  .icon-btn { position: relative; width: 34px; height: 34px; border: 1px solid var(--bar-line); border-radius: 6px; background: transparent; display: grid; place-items: center; color: #E6E9ED; }
  .dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #93C5FD; border: 0; font-weight: 700; color: #1E3A8A; font-size: 12px; overflow: hidden; display: grid; place-items: center; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .menu { position: absolute; top: 46px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px var(--shadow); min-width: 240px; padding: 6px; z-index: 30; }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: 6px; font-size: 13px; color: var(--text); }
  .menu button:hover { background: var(--head); }
  .menu button:disabled { color: var(--muted); opacity: .7; }
  .menu .sep { height: 1px; background: var(--line-2); margin: 4px 0; }
  .menu .hd { font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .04em; }
  /* module menu items, in the top bar next to the module name */
  .moditems { display: flex; align-items: stretch; align-self: stretch; gap: 2px; margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--bar-line); }
  .moditems button { border: 0; background: transparent; padding: 0 11px; font-size: 13px; color: #C9D6F0; border-bottom: 3px solid transparent; border-top: 3px solid transparent; white-space: nowrap; }
  .moditems button:hover { background: var(--bar-ctl); color: #fff; }
  .moditems button.on { color: #fff; font-weight: 600; border-bottom-color: #93C5FD; }
  /* open tabs row: tinted so the tabs stand out from the page */
  .tabrow { display: flex; align-items: stretch; gap: 2px; padding: 0 12px; height: 36px; background: var(--tabrow); border-bottom: 1px solid var(--tabrow-line); flex: 0 0 auto; overflow: hidden; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 14px; color: var(--tabrow-text); font-size: 13px; margin-top: 5px; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; border: 1px solid transparent; border-bottom: 0; background: transparent; }
  .tab:hover { background: var(--tabrow-hover); }
  .tab.on { background: var(--bg); color: var(--text); font-weight: 600; border-color: var(--tabrow-line); box-shadow: 0 1px 0 var(--bg); }
  .tab .x { opacity: .5; font-size: 12px; } .tab .x:hover { opacity: 1; }
  .tabrow .closeall { margin-left: auto; align-self: center; font-size: 12px; color: var(--tabrow-text); border: 1px solid transparent; background: transparent; padding: 4px 8px; border-radius: 4px; white-space: nowrap; } .tabrow .closeall:hover { background: var(--tabrow-hover); border-color: var(--tabrow-line); }
  /* advanced filter builder */
  .adv { display: flex; flex-direction: column; gap: 6px; }
  .adv .cond { display: grid; grid-template-columns: 72px 200px 160px 1fr auto; gap: 6px; align-items: center; }
  .adv .cond.two { grid-template-columns: 72px 200px 160px 1fr 1fr auto; }
  .adv .cond .join { font-size: 12px; font-weight: 700; text-align: center; color: var(--muted); }
  .adv .cond select.join { font-weight: 700; color: var(--primary); }
  .adv .or-sep { height: 1px; background: var(--line); margin: 4px 0; }
  .lk input.inp { padding-right: 36px !important; }
  .lk .mag { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .lk .mag:hover { background: var(--head); color: var(--primary); } .lk .mag.on { color: var(--primary); background: var(--accent); }
  .adv select, .adv input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; background: var(--surface); color: var(--text); width: 100%; }
  .adv .ft { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .cond-chip { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; background: var(--accent); color: var(--text); border: 1px solid var(--accent-line); padding: 2px 8px; border-radius: 4px; } .cond-chip b { font-weight: 600; } .cond-chip button { border: 0; background: transparent; color: var(--muted); padding: 0 2px; }
  /* home dashboard widgets: drag to relocate, drag corner to resize */
  .dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; grid-auto-flow: dense; }
  .wg { position: relative; min-width: 0; display: flex; flex-direction: column; }
  .wg .wg-hd { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px dashed var(--line-2); cursor: grab; user-select: none; }
  .wg .wg-hd:active { cursor: grabbing; } .wg .wg-hd .grip { letter-spacing: -2px; font-size: 14px; opacity: .6; }
  .wg .wg-bd { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
  .wg .wg-rs { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--line) 50%, var(--line) 60%, transparent 60%, transparent 75%, var(--line) 75%); border-radius: 0 0 6px 0; opacity: .8; }
  .wg.dragging { opacity: .4; } .wg.over { outline: 2px dashed var(--primary); outline-offset: 2px; }
  .wg.resizing { outline: 2px solid var(--primary); }
  .wg .kpi { border: 0; height: 100%; } .wg .grid { max-height: 100%; }

  .body { display: flex; flex-grow: 1; min-height: 0; }
  main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; overflow: auto; }
  aside.assist { flex: 0 0 400px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

  /* grid */
  .grid { display: flex; flex-direction: column; overflow: hidden; flex-grow: 1; min-height: 0; }
  .grid-hd { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .grid-body { overflow: auto; flex-grow: 1; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 0 12px; height: 36px; text-align: left; border-bottom: 1px solid var(--line-2); font-size: 14px; white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tr.f th { top: 36px; }
  th input, th select { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; background: var(--surface); color: var(--text); }
  th input.on, th select.on { border-color: var(--primary); background: var(--accent); }
  tbody tr:hover td { background: var(--hover); }
  tbody tr.clickable { cursor: pointer; }
  .grid-ft { display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--line-2); background: var(--head); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .pager { display: inline-flex; align-items: center; gap: 4px; } .pager button { min-width: 28px; height: 26px; padding: 0 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; font-size: 12px; color: var(--text); } .pager button.on { background: var(--primary); color: #fff; border-color: var(--primary); } .pager select { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-size: 12px; color: var(--text); }
  .sw { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

  /* home */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .kpi .l { font-size: 12px; color: var(--muted); } .kpi .v { font-size: 26px; font-weight: 700; margin-top: 2px; } .kpi .s { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .bar-mini { height: 6px; background: var(--line-2); border-radius: 3px; margin-top: 8px; overflow: hidden; } .bar-mini i { display: block; height: 100%; background: var(--primary); }
  .recs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rec { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .rec .who { font-size: 11px; color: var(--muted); font-family: "JetBrains Mono", monospace; }
  .rec .t { font-size: 15px; font-weight: 600; } .rec p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* assistant */
  .a-hd { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
  .a-log { flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; font-size: 14px; line-height: 1.5; overflow: auto; }
  .msg.u { align-self: flex-end; max-width: 88%; background: var(--primary); color: #fff; padding: 10px 12px; border-radius: 10px 10px 2px 10px; }
  .msg.a { max-width: 96%; background: var(--head); padding: 10px 12px; border-radius: 10px 10px 10px 2px; display: flex; flex-direction: column; gap: 8px; }
  .msg.a table { background: var(--surface); border: 1px solid var(--line-2); } .msg.a th, .msg.a td { height: 30px; font-size: 13px; }
  .msg.a th { position: static; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .confirm { overflow: hidden; }
  .confirm .ch { padding: 9px 12px; background: var(--accent); border-bottom: 1px solid var(--accent-line); font-weight: 600; font-size: 13px; }
  .confirm .ch.warn { background: var(--warn-bg); border-color: var(--warn-bg); }
  .confirm .cb { padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line-2); color: var(--muted); }
  .confirm .cb div { display: flex; justify-content: space-between; gap: 12px; } .confirm .cb div span:last-child { text-align: right; color: var(--text); }
  .confirm .cf { padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
  .confirm.done .ch { background: var(--ok-bg); border-color: var(--ok-bg); color: var(--ok); }
  .a-in { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line-2); }
  .a-in input { flex: 1 1 auto; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: var(--surface); }
  .typing { display: inline-flex; gap: 4px; padding: 6px 0; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; } .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%,80%,100% { opacity: .2 } 40% { opacity: 1 } }

  /* palette */
  #palette { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: start center; padding-top: 90px; z-index: 50; }
  .pal { width: 640px; background: var(--surface); border-radius: 10px; box-shadow: 0 30px 80px var(--shadow); overflow: hidden; }
  .pal input { width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line-2); font-size: 16px; outline: 0; background: var(--surface); }
  .pal ul { list-style: none; margin: 0; padding: 6px; max-height: 360px; overflow: auto; }
  .pal li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }

   ERP-IA · Prototipo fase 2 · Contabilidad y motor de contabilización
   Contrato visual y de comportamiento del módulo; datos simulados.

const TODAY = '2026-10-28';
const fmtMoney = n => (n < 0 ? '−' : '') + '$ ' + new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(n));
const fmtInt = n => new Intl.NumberFormat('es-CO').format(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const now = () => TODAY + ' ' + new Date().toTimeString().slice(0, 8);
const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const pad = (n, w = 2) => String(n).padStart(w, '0');
let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const pick = a => a[Math.floor(rnd() * a.length)];

function retryFailure(id) { const f = FAILURES.find(x => x.id === id); const pl = f.payload; let lines = [];
  if (f.event === 'sales.invoice.issued') { const rec = resolveRole('receivable'); lines.push([rec, pl.customerId, '', pl.total, 0, f.source]); for (const l of pl.lines) { const a = resolveRole('revenue', 'category:' + l.categoryId); if (!a) return toast(`Sigue sin cuenta: revenue · category:${catName(l.categoryId)}`); lines.push([a, '', pl.costCenterId, 0, l.subtotal, f.source]); } pl.taxes.forEach(t => lines.push([resolveRole('vat_out', 'tax:' + t.code), '', '', 0, t.amount, f.source, t.code, t.base])); }
  if (f.event === 'purchases.invoice.received') { for (const l of pl.lines) lines.push([resolveRole('inventory', 'category:' + l.categoryId), '', '', l.subtotal, 0, f.source]); pl.taxes.forEach(t => lines.push([resolveRole('vat_in', 'tax:' + t.code), '', '', t.amount, 0, f.source, t.code, t.base])); pl.withholdings.forEach(w => lines.push([resolveRole('withholding_income_payable', 'tax:' + w.code), pl.supplierId, '', 0, w.amount, f.source, w.code, pl.lines[0].subtotal])); lines.push([resolveRole('payable'), pl.supplierId, '', 0, pl.net, f.source]); }
  const po = dateOpen(f.date); if (po) return openPopup('Reintento fallido', `<div class="dian warn">${esc(po)}.</div><div class="small muted">El comprobante debe llevar la fecha del documento (${fmtDate(f.date)}). Reabre el período, o solo ese día, y vuelve a intentar.</div>`, `<button class="btn" onclick="closePopup()">Cerrar</button><button class="btn dark" onclick="closePopup();const p=periodOf('${f.date}');reopenPeriod(p.y,p.n)">Reabrir período</button>`);
  const e = mkEntry({ journal: RULES.find(r => r.id === f.rule).journal, date: f.date, desc: `${f.event === 'sales.invoice.issued' ? 'Factura electrónica' : 'Factura de compra'} ${f.source} · ${partyName(pl.customerId || pl.supplierId)}`, origin: 'auto', source: { type: f.event === 'sales.invoice.issued' ? 'Factura de venta' : 'Factura de compra', ref: f.source, entity: f.event.split('.').slice(0, 2).join('.') }, event: f.event, rule: f.rule, lines }); const ok = doPost(e.id, 'system'); if (!ok) { ENTRIES.pop(); return; } f.status = 'resolved'; f.entry = e.id; logAudit('ui', 'accounting.posting.retry', 'accounting.posting_failures/' + f.id, `${f.source} contabilizado como ${e.num}`, e.chain); closeModal(); render(); openEntry(e.id); }

function ask(text) { bubble('u', esc(text)); const typing = bubble('a', `<span class="typing"><i></i><i></i><i></i></span>`); setTimeout(() => { typing.remove(); answer(text); }, 650); }
let confirmN = 0;
function confirmCard(title, rows, onConfirm, opts = {}) { const n = ++confirmN; const needs2fa = opts.sensitive && !stepUpFresh(); const el = bubble('a', `<div>${opts.lead || 'Necesito tu confirmación:'}</div><article class="card confirm" id="cc-${n}"><div class="ch ${needs2fa ? 'warn' : ''}">${title}</div><div class="cb">${rows.map(([a, b]) => `<div><span>${a}</span><span>${b}</span></div>`).join('')}<div><span>Proceso</span><span class="mono">${opts.perm} · ${opts.sensitive ? (needs2fa ? 'requiere TOTP' : 'TOTP vigente') : 'sin TOTP'}</span></div></div><div class="cf" id="cf-${n}">${needs2fa ? `<input id="su-${n}" class="mono inp" maxlength="6" inputmode="numeric" placeholder="código TOTP" style="width:130px;letter-spacing:3px" onkeydown="if(event.key==='Enter')document.getElementById('ok-${n}').click()">` : ''}<button id="ok-${n}" class="btn dark">${needs2fa ? 'Verificar y confirmar' : 'Confirmar'}</button><button class="btn" onclick="toast('Edición: abre el borrador con los valores propuestos')">Editar</button><button class="btn ghost" id="no-${n}">Cancelar</button></div></article>`); const card = el.querySelector('#cc-' + n); const finish = (ok, note) => { card.classList.toggle('done', ok); card.querySelector('.ch').textContent = (ok ? '✓ ' : '✕ ') + title; card.querySelector('#cf-' + n).innerHTML = `<span class="small">${note}</span>`; };
  el.querySelector('#ok-' + n).onclick = () => { if (needs2fa) { const c = el.querySelector('#su-' + n).value; if (!/^\d{6}$/.test(c)) return toast('Código inválido'); stepUpAt = Date.now(); logAudit('agent', 'auth.step_up', 'kernel.step_up_verifications', 'verificado desde el asistente'); } const res = onConfirm(); finish(res.ok, res.note); }; el.querySelector('#no-' + n).onclick = () => { finish(false, 'Cancelado · nada cambió'); logAudit('agent', opts.perm, '', 'cancelado por el usuario: ' + title); }; }
function answer(t) { const q = t.toLowerCase();
  if (q.includes('me debe') || q.includes('deben') || q.includes('cartera')) { const rows = agingRows('1305', TODAY); const over = rows.filter(r => r.b[4] > 0.5).sort((a, b) => b.b[4] - a.b[4]); const T = rows.reduce((s, r) => s + r.total, 0); return bubble('a', `Cartera de clientes al ${fmtDate(TODAY)}: ${fmtMoney(T)} abiertos; ${over.length} cliente(s) con saldos de más de 90 días:<table><tr><th>Cliente</th><th class="r">> 90 días</th><th class="r">Total abierto</th></tr>${over.map(r => `<tr><td>${esc(partyName(r.party))}</td><td class="r num" style="color:var(--danger)">${fmtMoney(r.b[4])}</td><td class="r num">${fmtMoney(r.total)}</td></tr>`).join('')}</table><span class="small muted">Consulta <span class="mono">accounting.report.aging</span> · partidas abiertas FIFO por tercero</span>${chips([{ l: 'Abrir cartera por edades', on: "repParams.kind='1305';repParams.asof=TODAY;go('informes',{report:'edades'})" }])}`); }
  if ((q.includes('vendimos') || q.includes('ventas') || q.includes('resultado')) && q.includes('unidad')) { const p = YEARS[1].periods[8]; const [f, to] = periodRange(p); const rows = dimOrdered('bu').map(c => [c, resultBetween(f, to, { bu: c.id })]).filter(r => r[1].ingresos || r[1].gastos || r[1].costos); const tot = rows.filter(r => !r[0].parent).reduce((s, r) => s + r[1].utilidad, 0); return bubble('a', `Resultado de ${periodLabel(p)} por unidad de negocio (los grupos acumulan sus hojas; lo no asignado queda fuera):<table><tr><th>Unidad</th><th class="r">Ingresos</th><th class="r">Resultado</th></tr>${rows.map(r => `<tr><td class="${r[0].parent ? 'ind1' : ''}">${r[0].parent ? esc(r[0].nombre) : '<b>' + esc(r[0].nombre) + '</b>'}</td><td class="r num">${fmtMoney(r[1].ingresos)}</td><td class="r num" style="color:${r[1].utilidad >= 0 ? 'var(--ok)' : 'var(--danger)'}">${fmtMoney(r[1].utilidad)}</td></tr>`).join('')}<tr><td><b>Total asignado</b></td><td></td><td class="r num"><b>${fmtMoney(tot)}</b></td></tr></table><span class="small muted">Consulta <span class="mono">accounting.report.dimension_detail</span> · dimensión unidad de negocio</span>${chips([{ l: 'Abrir el informe', on: "repParams.dim='bu';repParams.node='B2C';repParams.from='2026-09-01';repParams.to='2026-09-30';go('informes',{report:'dimension'})" }])}`); }
  if ((q.includes('vendimos') || q.includes('ventas')) && (q.includes('ítem') || q.includes('item'))) { const p = YEARS[1].periods[8]; const [f, to] = periodRange(p); const rows = dimOrdered('item').map(c => [c, -balance('41', f, to, { item: c.id, excludeClosing: true }).net]).filter(r => r[1]); const tot = rows.filter(r => !r[0].parent).reduce((s, r) => s + r[1], 0); return bubble('a', `Ventas de ${periodLabel(p)} por ítem (clase 41, sin IVA; los grupos acumulan sus hojas):<table><tr><th>Ítem</th><th class="r">Ingresos</th><th class="r">%</th></tr>${rows.map(r => `<tr><td class="${r[0].parent ? 'ind1' : ''}">${r[0].parent ? esc(r[0].nombre) : '<b>' + esc(r[0].nombre) + '</b>'}</td><td class="r num">${fmtMoney(r[1])}</td><td class="r num">${(r[1] / tot * 100).toFixed(1)} %</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="r num"><b>${fmtMoney(tot)}</b></td><td></td></tr></table><span class="small muted">Consulta <span class="mono">accounting.report.dimension_detail</span> · dimensión ítem</span>${chips([{ l: 'Abrir el informe', on: "repParams.dim='item';repParams.node='CAF';repParams.from='2026-09-01';repParams.to='2026-09-30';go('informes',{report:'dimension'})" }])}`); }
  if (q.includes('vendimos') || q.includes('ventas por centro')) { const p = YEARS[1].periods[8]; const [f, to] = periodRange(p); const rows = leafCcs().map(c => [c.nombre, resultBetween(f, to, { cc: c.id }).ingresos]).filter(r => r[1]); const tot = rows.reduce((s, r) => s + r[1], 0); return bubble('a', `Ventas de ${periodLabel(p)} por centro de costo (clase 4, ingresos operacionales, sin IVA):<table><tr><th>Centro de costo</th><th class="r">Ingresos</th><th class="r">%</th></tr>${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="r num">${fmtMoney(r[1])}</td><td class="r num">${(r[1] / tot * 100).toFixed(1)} %</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="r num"><b>${fmtMoney(tot)}</b></td><td></td></tr></table><span class="small muted">Consulta <span class="mono">accounting.report.ccosto</span> · período cerrado el 06/10/2026</span>${chips([{ l: 'Abrir el informe', on: "repParams.from='2026-09-01';repParams.to='2026-09-30';go('informes',{report:'ccosto'})" }])}`); }
  if (q.includes('fe-1402') || q.includes('no se contabiliz')) { return bubble('a', `<b>FE-1402</b> (Panadería La Espiga, $ 2.975.000,00, 27/10/2026) se emitió y la DIAN la aceptó. El motor contabilizó su costo de ventas (regla Inventario), pero la venta quedó en <b>Pendientes de contabilizar</b>: la línea de Accesorios ($ 700.000,00) no tiene cuenta de ingresos (<span class="mono">revenue · category:Accesorios</span>) y tampoco hay cuenta por defecto para el rol.<br><br>Para resolverlo: mapea la categoría Accesorios a <span class="mono">413515</span> y reintenta. Puedo proponer el mapeo, pero cambiarlo es sensible y pedirá tu código.${chips([{ l: 'Mapear Accesorios → 413515', on: "ask('Mapea Accesorios a 413515')" }, { l: 'Ver el pendiente', on: "go('reglas',{tab:'pendientes'})" }, { l: 'Abrir la categoría', on: "openCategory('C3')" }])}`); }
  if (q.includes('mapea') || q.includes('mapear')) { return confirmCard('Mapear revenue · category:Accesorios → 413515', [['Rol', 'revenue (Ingresos por ventas)'], ['Dimensión', 'Categoría · Accesorios'], ['Cuenta', '413515 Accesorios'], ['Efecto', 'FE-1402 podrá reintentarse']], () => { saveMapping('revenue', 'category:C3', '413515'); logAudit('agent', 'accounting.account_role_mapping.update', 'accounting.account_role_mappings', 'revenue category:C3 → 413515 (confirmado)'); return { ok: true, note: 'Mapeo guardado · ahora Reintentar en Pendientes de contabilizar' }; }, { perm: 'accounting.account_role_mapping.update', sensitive: true }); }
  if (q.includes('arriendo')) { return confirmCard('Crear borrador · Arriendo local Chapinero octubre', [['Fuente', 'NC · Nota de contabilidad'], ['Fecha', fmtDate(TODAY)], ['512010 Arrendamientos · Chapinero', 'Dr $ 3.500.000,00'], ['236525 Retefuente servicios 4 %', 'Cr $ 140.000,00'], ['233540 Arrendamientos por pagar · Arrendamientos Chapinero', 'Cr $ 3.360.000,00'], ['Plantilla', 'Arriendo mensual Chapinero']], () => { const e = fromTemplate('T1', 'agent'); render(); return { ok: true, note: `Borrador creado · <a href="#" onclick="openEntry('${e.id}');return false">abrirlo</a> para revisar y contabilizar` }; }, { perm: 'accounting.entry.create', lead: 'Preparé el comprobante desde la plantilla. Queda como borrador; contabilizarlo es otro paso tuyo.' }); }
  if (q.includes('falta para cerrar') || q.includes('qué falta')) { const p = YEARS[1].periods[9]; const [f, to] = periodRange(p); const drafts = ENTRIES.filter(e => e.date >= f && e.date <= to && e.status === 'borrador'); const pend = FAILURES.filter(x => x.status === 'pending' && x.date >= f && x.date <= to); return bubble('a', `Para cerrar ${periodLabel(p)} faltan:<ul style="margin:4px 0;padding-left:18px">${drafts.map(d => `<li>Borrador: <a href="#" onclick="openEntry('${d.id}');return false">${esc(d.desc)}</a></li>`).join('')}${pend.map(x => `<li>Pendiente: ${x.source} · ${x.code}</li>`).join('')}${YEARS[1].periods[8].status !== 'closed' ? '<li>Septiembre sigue abierto (los períodos se cierran en orden)</li>' : ''}${!drafts.length && !pend.length ? '<li>Nada: puedes cerrarlo</li>' : ''}</ul>Además suelen faltar la depreciación y la provisión de prestaciones del mes; puedo proponerlas desde las plantillas.${chips([{ l: 'Ver períodos', on: "go('periodos')" }, { l: 'Registra el arriendo de octubre', on: "ask('Registra el arriendo de octubre')" }])}`); }
  if (q.includes('cierra') || q.includes('cerrar')) { const n = q.includes('octubre') ? 10 : 9; const p = YEARS[1].periods[n - 1]; if (p.status === 'closed') return bubble('a', `${periodLabel(p)} ya está cerrado (06/10/2026, por laura@demo.local). Si necesitas contabilizar algo con fecha de ese mes, puedo reabrirlo solo para ese día.${chips([{ l: 'Reabrir 29/09 para FC-7781', on: "reopenPeriod(2026,9)" }])}`); const [f, to] = periodRange(p); const drafts = ENTRIES.filter(e => e.date >= f && e.date <= to && e.status === 'borrador'); const pend = FAILURES.filter(x => x.status === 'pending' && x.date >= f && x.date <= to); return confirmCard(`Cerrar ${periodLabel(p)}`, [['Comprobantes', String(ENTRIES.filter(e => e.date >= f && e.date <= to && e.num).length)], ['Borradores', String(drafts.length)], ['Pendientes', String(pend.length)], ['Resultado', fmtMoney(resultBetween(f, to).utilidad)]], () => { if (drafts.length || pend.length) { logAudit('agent', 'accounting.period.close', `accounting.periods/${p.y}-${pad(p.n)}`, 'rechazado: borradores o pendientes'); return { ok: false, note: `Rechazado por el proceso: ${drafts.length} borradores y ${pend.length} pendientes en el período. Resuélvelos y vuelve a pedirlo.` }; } p.status = 'closed'; logAudit('agent', 'accounting.period.close', `accounting.periods/${p.y}-${pad(p.n)}`, periodLabel(p) + ' cerrado desde el asistente'); render(); return { ok: true, note: 'Período cerrado' }; }, { perm: 'accounting.period.close', sensitive: true }); }
  if (q.includes('saldo') || q.includes('banco')) { const b = balance('11100501', '2026-01-01', TODAY).net; return bubble('a', `El saldo de <span class="mono">11100501</span> Bancolombia al ${fmtDate(TODAY)} es <b>${fmtMoney(b)}</b> (saldo inicial más movimientos contabilizados; los borradores no cuentan).${chips([{ l: 'Ver auxiliar', on: "repParams.acct='11100501';repParams.from='2026-01-01';repParams.to=TODAY;go('informes',{report:'auxiliar'})" }])}`); }
  bubble('a', `Puedo responder sobre saldos, movimientos y documentos, proponer comprobantes desde plantillas y preparar cierres. Prueba: “¿cuánto vendimos en septiembre por centro de costo?”, “¿qué pasó con la factura FE-1402?”, “registra el arriendo de octubre”, “cierra septiembre”.`); }

/* ---------- boot ---------- */
greet(); render();
</script>
<script>
(function () { if (!window.matchMedia('(max-width: 760px)').matches) return; const a = document.getElementById('assist'); if (!a) return; a.hidden = true; const hd = a.querySelector('.a-hd .row'); if (hd && !hd.querySelector('.a-close')) hd.insertAdjacentHTML('beforeend', '<span class="grow"></span><button class="btn sm a-close" onclick="toggleAssistant()">Cerrar</button>'); })();
</script>
