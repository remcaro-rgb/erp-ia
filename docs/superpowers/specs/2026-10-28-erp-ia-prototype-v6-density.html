const $ = (s, r = document) => r.querySelector(s);

const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const grp = n => String(Math.trunc(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmtInt = n => (n < 0 ? '-' : '') + grp(n);
/** rule 23: $ 1.234.567,00 (es-CO, two decimals). */
const fmtMoney = n => { const v = Math.round(Number(n || 0) * 100); const a = Math.abs(v); return (v < 0 ? '-' : '') + '$ ' + grp(Math.floor(a / 100)) + ',' + String(a % 100).padStart(2, '0'); };
const parseMoney = s => { const t = String(s ?? '').replace(/[^\d,]/g, ''); const [i, d = ''] = t.split(','); return Number((i || '0') + '.' + (d || '0').slice(0, 2)); };

/* ---------- export jobs (§2.15): they live in the shell, so a tab change does not abort them ---------- */
const jobs = {};
const FMT = { pdf: 'PDF', xlsx: 'Excel', csv: 'CSV' };
function startExport(id, fmt) {
  const key = `${id}:${fmt}`; if (jobs[key]?.phase === 'working') return toast(`Ya se está generando el ${FMT[fmt]}`);
  const n = filteredRows(id).length; const file = `${ENT[id].file}-2026-10-28.${fmt}`; const total = fmt === 'xlsx' ? 7000 : fmt === 'pdf' ? 2400 : 900;
  const job = jobs[key] = { id, fmt, phase: 'working', file, rows: n, done: 0, t0: Date.now() };
  renderExportStatus(id);
  const tick = setInterval(() => {
    job.done = Math.min(n, Math.round(n * (Date.now() - job.t0) / total));
    if (Date.now() - job.t0 >= total) {
      clearInterval(tick); job.phase = 'ready'; job.done = n; renderExportStatus(mountedGrid);
      toast('', null, { html: `Archivo listo: <span class="font-mono">${esc(file)}</span> · ${plural(n, 'fila', 'filas')} <span class="opacity-80">(prototipo: no descarga)</span>`, icon: ICON[fmt].replace(/text-ic-\w+/, 'text-toast-ok'), action: { label: 'Descargar de nuevo', run: () => toast('Descarga con URL firmada de 60 s', 'kernel.export.download') }, ms: 6500 });
      setTimeout(() => { if (jobs[key] === job) { delete jobs[key]; renderExportStatus(mountedGrid); } }, 8000);
    } else if (mountedGrid === id && route === id) renderExportStatus(id);
  }, 250);
}
function renderExportStatus(id) {
  const s = $('#g-status'); if (!s || !id || mountedGrid !== id || route !== id) return;
  const j = Object.values(jobs).find(x => x.id === id && x.phase === 'working') || Object.values(jobs).find(x => x.id === id);
  const text = j ? (j.phase === 'working' ? `${FMT[j.fmt]} en segundo plano · ${fmtInt(j.done)} de ${fmtInt(j.rows)} filas · puedes cambiar de pestaña` : `Archivo listo: ${j.file}`) : statusTemp;
  s.textContent = text; s.title = text;
}

<script>

/* ================================================================ step-up prompt (§2.18): autofocus, the 6th digit sends, Esc cancels ================================================================ */

function stepUpInline(host, { onOk, onCancel, what }) {
  const id = 'su' + Date.now();
  host.innerHTML = `<div role="group" aria-labelledby="${id}-l" class="flex min-w-0 grow flex-wrap items-center gap-2 rounded-md bg-warn-bg px-3 py-1.5 text-warn">
    <b id="${id}-l" class="text-[13px] whitespace-nowrap">Verificación en dos pasos</b><span id="${id}-d" class="hidden text-xs lg:inline">${esc(what)} · se envía solo al sexto dígito</span>
    <input id="${id}" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" aria-label="Código de verificación de 6 dígitos" aria-describedby="${id}-d ${id}-e" aria-keyshortcuts="Escape" class="h-9 w-[136px] rounded-md border border-line-input bg-surface text-center font-mono text-base tracking-[6px] text-text focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-focus-ring">
    <button type="button" data-ok disabled class="rounded-md bg-primary px-2.5 py-[5px] text-xs font-semibold text-white disabled:opacity-50">Confirmar</button>
    <button type="button" data-cancel class="rounded-md px-2.5 py-[5px] text-xs text-warn underline">Cancelar (Esc)</button>
    <span id="${id}-e" role="alert" class="text-[11px] font-semibold text-danger"></span></div>`;
  const inp = host.querySelector('input'), ok = host.querySelector('[data-ok]'), err = host.querySelector(`#${id}-e`); let busy = false;
  const verify = async code => { if (busy || !/^\d{6}$/.test(code)) return; busy = true; inp.disabled = true; ok.disabled = true; ok.textContent = 'Verificando…'; await sleep(380); busy = false;

function initCard(art, c, edit = false) {

  const reject = () => { art.innerHTML = cardHtml(c, 'rejected'); $('#erp-assistant-input').focus(); aFollow(); };
  q('[data-cancel]').onclick = reject;
  q('[data-edit]').onclick = () => { if (edit) { $$('[data-e]', art).forEach(i => c.rows[+i.dataset.e][1] = i.value); } art.innerHTML = cardHtml(c, 'pending', !edit); initCard(art, c, !edit); if (!edit) art.querySelector('[data-e]')?.focus(); else art.querySelector('[data-edit]').focus(); };
  q('[data-dl]').addEventListener('keydown', e => { if (edit && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); art.innerHTML = cardHtml(c, 'pending'); initCard(art, c); art.querySelector('[data-edit]').focus(); } });
  q('[data-confirm]').onclick = () => confirmCard(art, c);

      if (v === '000000') { code.disabled = false; code.value = ''; q(`#${c.id}-err`).textContent = 'Código incorrecto. Intenta de nuevo.'; code.focus(); return; }

    code.addEventListener('input', () => { const v = code.value.replace(/\D/g, '').slice(0, 6); code.value = v; q('[data-verify]').disabled = v.length !== 6; if (v.length) q(`#${c.id}-err`).textContent = ''; if (v.length === 6) verify(v); });

const livePollers = [];
/** A polling loop that shows itself, pauses while the browser tab is hidden and survives errors (never a silent stop). */
function makePoller({ every, read, pending, onChange }) {
  const p = { state: pending() ? 'live' : 'idle', at: new Date(), timer: null, failNext: false };
  const arm = (ms = every) => { clearTimeout(p.timer); if (p.state === 'error' || !pending()) return; if (document.visibilityState !== 'visible') { p.state = 'paused'; onChange(); return; } p.timer = setTimeout(tick, ms); };

  p.resume = () => { p.state = pending() ? 'live' : 'idle'; onChange(); tick(); };
  p.kick = () => { if (p.state !== 'error') { p.state = pending() ? 'live' : 'idle'; onChange(); arm(); } };
  p.onVisibility = () => { if (document.visibilityState === 'visible' && p.state === 'paused') { p.state = 'live'; onChange(); tick(); } else if (document.visibilityState !== 'visible' && p.state === 'live') { clearTimeout(p.timer); p.state = 'paused'; onChange(); } };
  livePollers.push(p); return p;
}
function liveHtml(p, onResume) {

  if (p.state === 'idle') return `<span class="text-xs text-text-muted">Actualizado ${fmtTime(p.at, true)}</span>`;

  const label = p.state === 'live' ? 'En vivo' : p.state === 'paused' ? 'En pausa · pestaña oculta' : 'Sin conexión';
  return `<span role="status" class="inline-flex h-5 items-center gap-1.5 rounded-full border border-line-2 bg-head px-2 text-xs whitespace-nowrap text-text-muted">${dot}${label} ${p.state === 'error' ? '' : t}${p.state !== 'live' && onResume ? `<button type="button" class="text-xs text-link underline" onclick="${onResume}">Reanudar</button>` : ''}</span>`;

function kpisHtml() {
